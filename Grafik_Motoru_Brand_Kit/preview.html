<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grafik Motoru Brand Preview</title>
  <link rel="stylesheet" href="grafik_motoru_brand.css" />
  <style>
    body { margin:0; padding:48px; }
    .wrap { max-width:960px; margin:auto; }
    .hero { padding:42px; }
    .brand { display:flex; gap:20px; align-items:center; }
    .brand img { width:96px; height:96px; object-fit:contain; }
    h1 { font-size:52px; margin:0; }
    .orange { color:var(--gm-orange); }
    .tagline { font-size:22px; color:var(--gm-slate); margin:12px 0 26px; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="gm-card hero">
      <div class="brand">
        <img src="grafik_motoru_icon_512.png" alt="Grafik Motoru ikonu">
        <div>
          <h1 class="gm-title">Grafik <span class="orange">Motoru</span></h1>
          <div class="tagline">Sosyal medyanı hızlandır.</div>
          <button class="gm-btn-primary">Hemen Tasarla</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
