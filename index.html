<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Grafik Motoru - AI Tasarım Platformu</title>
    <meta name="description" content="Grafik Motoru, yapay zeka destekli profesyonel bir grafik tasarım platformudur. Saniyeler içinde şablonlarınızı oluşturun, otomatik olarak resimlerinizi analiz edip yüksek çözünürlükte çıktılar alın." />
    <meta name="keywords" content="Grafik Motoru, AI Tasarım, Yapay Zeka Tasarım, Otomatik Tasarım, Grafik Tasarım, Toplu Çıktı" />
    <meta name="author" content="Grafik Motoru" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Grafik Motoru - AI Tasarım Platformu" />
    <meta property="og:description" content="Saniyeler içinde profesyonel tasarımlar oluşturun. Yapay zeka ile otomatik boyutlandırma ve yerleştirme." />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Grafik Motoru - AI Tasarım Platformu" />
    <meta property="twitter:description" content="Saniyeler içinde profesyonel tasarımlar oluşturun. Yapay zeka ile otomatik boyutlandırma ve yerleştirme." />
    
    <!-- PWA & Apple Web App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grafik Motoru" />
    <meta name="theme-color" content="#1D1D1F" />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="/grafik_motoru_icon_512.png" />
    <link rel="apple-touch-icon" href="/grafik_motoru_icon_512.png" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;900&family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@500;700;800&family=Montserrat:wght@400;700;900&family=Poppins:wght@300;400;600;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700;900&family=Bebas+Neue&family=Russo+One&family=Permanent+Marker&family=Dancing+Script:wght@700&family=Arimo:ital,wght@0,400..700;1,400..700&family=Roboto:wght@300;400;500;700&family=Oswald:wght@400;600;700&display=swap" />
  </head>
  <body class="bg-[#090A0F] text-[rgba(255,255,255,0.95)]">
    <style>
      #native-loader {
        position: fixed; inset: 0; background-color: #090A0F; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999999; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.6s;
      }
      #native-loader.ds-hidden {
        opacity: 0; visibility: hidden; pointer-events: none;
      }
      .loader-logo {
        width: 54px; height: 54px; background: #FF6B1A; border-radius: 16px; display: flex; justify-content: center; align-items: center; color: white; font-weight: 800; box-shadow: 0 8px 30px rgba(255, 107, 26, 0.35); margin-bottom: 24px; border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .loader-bar-container {
        width: 140px; height: 3px; background-color: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; position: relative; margin-bottom: 12px;
      }
      .loader-bar-progress {
        position: absolute; left: 0; top: 0; bottom: 0; width: 30%; background-color: #FF6B1A; border-radius: 3px; animation: ds-load 1.8s infinite ease-in-out;
      }
      .loader-text {
        font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.72); letter-spacing: -0.01em; animation: ds-pulse 2s infinite ease-in-out;
      }
      @keyframes ds-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
      @keyframes ds-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
    <div id="native-loader">
      <div class="loader-logo">
        <img src="/grafik_motoru_icon_512.png" alt="Grafik Motoru" style="width: 34px; height: 34px; object-fit: contain;" />
      </div>
      <div class="loader-bar-container"><div class="loader-bar-progress"></div></div>
      <div class="loader-text">Grafik Motoru hazırlanıyor...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
